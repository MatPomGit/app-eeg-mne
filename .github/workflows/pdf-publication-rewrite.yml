name: Rewrite EEG P3 notebook for reader-only PDF
on:
  push:
    branches:
      - fix/pdf-publication-reader-only-20261122
    paths:
      - notebook/sanitize_pdf_publication.py
      - tests/test_pdf_publication.py
      - .github/workflows/pdf-publication-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite prose and export code without running EEG
        run: python notebook/sanitize_pdf_publication.py
      - name: Validate scientific publication and notebook code
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s notebook/tests -v
      - name: Commit validated notebook on this change branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebook/eeg_P3_ERP_1.6.4.ipynb
          if ! git diff --cached --quiet; then
            git commit -m 'fix(pdf): remove author-facing text from P3 notebook [skip ci]'
            git push origin HEAD:fix/pdf-publication-reader-only-20261122
          fi
