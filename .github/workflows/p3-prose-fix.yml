name: Correct P3 notebook prose
on:
  push:
    branches: [fix/p3-polska-proza-20261122]
    paths:
      - notebook/polish_notebook_prose.py
      - .github/workflows/p3-prose-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Polish-language editorial corrections
        run: python notebook/polish_notebook_prose.py
      - name: Verify notebook and PDF publication contracts
        run: python -m unittest discover -s tests -p 'test_pdf_publication.py' -v
      - name: Commit the revised notebook to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebook/eeg_P3_ERP_1.6.4.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "docs(eeg): apply Polish-language prose corrections [skip ci]"
            git push origin HEAD:fix/p3-polska-proza-20261122
          fi
