name: Scientific content
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check notebook syntax and methods
        run: python -m unittest discover -s tests -v
