name: Sanitize P3 PDF notebook (one-shot)
on:
  push:
    branches:
      - fix/eeg-pdf-clean-export-20261122
    paths:
      - .github/workflows/eeg-pdf-cleanup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Edit notebook without executing EEG processing
        run: python notebook/sanitize_pdf_publication.py
      - name: Commit cleaned notebook to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebook/eeg_P3_ERP_1.6.4.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "fix(eeg): remove editorial report templates [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
