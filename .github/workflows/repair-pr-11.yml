name: One-shot PR 11 notebook merge repair
on:
  push:
    branches:
      - bla
    paths:
      - .github/workflows/repair-pr-11.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'MatPomGit/app-eeg-mne'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bla
          persist-credentials: true
      - name: Resolve exactly two merge conflicts and validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path
          path = Path('notebook/eeg_P3_ERP_1.6.4.ipynb')
          raw = path.read_text(encoding='utf-8')
          pattern = re.compile(r'^<<<<<<< HEAD\r?\n(.*?)^=======\r?\n(.*?)^>>>>>>>[^\r\n]*(?:\r?\n|$)', re.M | re.S)
          matches = pattern.findall(raw)
          if len(matches) != 2:
              raise RuntimeError(f'Expected exactly two conflict blocks, found {len(matches)}')
          fixed = pattern.sub(lambda match: match.group(2), raw)
          doc = json.loads(fixed)
          cells = doc['cells']
          code = [cell for cell in cells if cell['cell_type'] == 'code']
          if len(cells) != 126 or len(code) != 45:
              raise RuntimeError('Unexpected notebook cell counts')
          if sum(len(c.get('outputs', [])) for c in code) != 72:
              raise RuntimeError('Saved EEG results must remain intact')
          for cell in code:
              ast.parse(''.join(cell['source']))
          exporters = [''.join(c['source']) for c in code if 'def export_full_notebook_pdf():' in ''.join(c['source'])]
          if len(exporters) != 1:
              raise RuntimeError('Missing PDF exporter')
          exporter = exporters[0]
          required = ['with TemporaryDirectory(prefix=\'eeg-p3-publication-\',', 'staged_pdf.replace(PDF_FILE)', 'pdf_editorial_labels = re.search(', 'editorial_labels = re.search(']
          if any(token not in exporter for token in required):
              raise RuntimeError('PDF exporter lost safety checks')
          if re.search(r'^(<<<<<<<|=======|>>>>>>>)', fixed, re.M):
              raise RuntimeError('Unresolved Git merge marker')
          path.write_text(fixed, encoding='utf-8')
          print('Validated notebook JSON, 126 cells, 45 code cells, 72 saved outputs, PDF safety checks.')
          PY
      - name: Run repository regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s notebook/tests -v
      - name: Commit verified repair and remove temporary workflow
        shell: bash
        run: |
          git rm -- .github/workflows/repair-pr-11.yml
          git add -- notebook/eeg_P3_ERP_1.6.4.ipynb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: resolve notebook conflicts and preserve validated PDF export'
          git push origin HEAD:bla
