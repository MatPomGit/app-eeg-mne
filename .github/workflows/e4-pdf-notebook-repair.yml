name: One-shot E4 PDF notebook repair
on:
  push:
    branches:
      - fix/pdf-publication-audience-20261122
    paths:
      - .github/workflows/e4-pdf-notebook-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'MatPomGit/app-eeg-mne' && github.ref == 'refs/heads/fix/pdf-publication-audience-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-publication-audience-20261122
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sanitize notebook without running EEG analyses
        run: |
          python notebook/sanitize_pdf_publication.py
          python -m unittest discover -s tests -p test_pdf_publication.py -v
          python -m unittest discover -s notebook/tests -v
      - name: Commit only sanitized notebook to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- notebook/eeg_P3_ERP_1.6.4.ipynb
          if git diff --cached --quiet; then
            echo 'Notebook already matches checked sanitizer.'
          else
            git commit -m 'fix(pdf): apply reviewed sanitizer to notebook [skip ci]'
            git push origin HEAD:fix/pdf-publication-audience-20261122
          fi
